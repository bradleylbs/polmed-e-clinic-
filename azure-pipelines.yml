# Azure Pipelines for POLMED ERP (Next.js frontend + Flask backend)
# - Builds frontend with pnpm and publishes artifact
# - Builds backend (Flask) with Python and publishes artifact
# - Optional deployment stage placeholders (disabled unless variables provided)

trigger:
  branches:
    include:
      - master
      - main

pr:
  branches:
    include:
      - master
      - main

variables:
  # Align with Azure App Service runtimes you created
  node_version: '20.x'
  python_version: '3.10'
  frontend_artifact: 'frontend'
  backend_artifact: 'backend'
  # Backend base URL for Static Web Apps API proxy rewrite
  BACKEND_BASE_URL: 'https://app-polmed-backend-fmamhma6g4gngfey.southafricanorth-01.azurewebsites.net'
  # Frontend build-time API base for App Service deployments (used by NEXT at build time)
  NEXT_PUBLIC_API_URL: 'https://app-polmed-backend-fmamhma6g4gngfey.southafricanorth-01.azurewebsites.net/api'
  # Optional deploy variables (leave empty to skip Deploy stage)
  azureServiceConnection: ''
  AZURE_WEBAPP_NAME_FRONTEND: 'app-polmed-frontend'
  AZURE_WEBAPP_NAME_BACKEND: 'app-polmed-backend'
  ResourceGroupName: 'ERP_POLMED'
  # Backend app settings (fill in in pipeline variables or variable group)
  SECRET_KEY: ''
  DB_HOST: ''
  DB_NAME: ''
  DB_USER: ''
  DB_PASSWORD: ''
  CORS_ALLOWED_ORIGINS: 'https://app-polmed-frontend-hdc0bwcwcceth4gk.southafricanorth-01.azurewebsites.net'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and package
    jobs:
      - job: BuildFrontend
        displayName: Build frontend (Next.js)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(node_version)
            displayName: 'Use Node.js $(node_version)'

          - script: |
              npm i -g corepack
              corepack enable
              corepack prepare pnpm@8.15.8 --activate
              pnpm -v
            displayName: 'Install pnpm'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: 'pnpm | "$(Agent.OS)"'
              path: '$(Pipeline.Workspace)/.pnpm-store'
            displayName: 'Cache pnpm store'

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: 'Install frontend dependencies'

          - script: |
              pnpm build
              # Next.js static export outputs to 'out' when output: 'export' is set
              test -d out && echo "Export dir exists: out" || echo "No out dir created"
            displayName: 'Build frontend (export)'
            env:
              NEXT_PUBLIC_API_URL: $(NEXT_PUBLIC_API_URL)

          # Inject backend URL into SWA config if provided
          - script: |
              if [ -n "$(BACKEND_BASE_URL)" ]; then
                echo "Injecting backend URL into public/staticwebapp.config.json"
                sed -i "s~__BACKEND_URL__~$(BACKEND_BASE_URL)~g" public/staticwebapp.config.json || true
                # Ensure exported site contains the config
                if [ -d out ]; then
                  mkdir -p out
                  cp public/staticwebapp.config.json out/staticwebapp.config.json
                fi
              fi
            displayName: 'Configure SWA backend proxy (optional)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/out'
              ArtifactName: '$(frontend_artifact)'
              publishLocation: 'Container'
            displayName: 'Publish frontend static artifact'

      - job: BuildBackend
        displayName: Build backend (Flask)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(python_version)'
            displayName: 'Use Python $(python_version)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r scripts/requirements.txt
            displayName: 'Install backend dependencies'

          - script: |
              if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
              if [ -d tests ]; then python -m pytest -q || true; fi
            displayName: 'Run backend tests (optional)'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/scripts'
              includeRootFolder: true
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
              replaceExistingArchive: true
            displayName: 'Archive backend files'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend.zip'
              ArtifactName: '$(backend_artifact)'
              publishLocation: 'Container'
            displayName: 'Publish backend artifact'

  - stage: Deploy
    displayName: Deploy to Azure (optional)
    dependsOn: Build
    condition: and(ne(variables.azureServiceConnection, ''), or(ne(variables.AZURE_WEBAPP_NAME_FRONTEND, ''), ne(variables.AZURE_WEBAPP_NAME_BACKEND, '')))
    jobs:
      - deployment: DeployBackend
        displayName: Deploy backend (Flask) to Azure Web App
        environment: 'dev'
        condition: and(ne(variables.azureServiceConnection, ''), ne(variables.AZURE_WEBAPP_NAME_BACKEND, ''))
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(backend_artifact)
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(AZURE_WEBAPP_NAME_BACKEND)'
                    package: '$(Pipeline.Workspace)/$(backend_artifact)/backend.zip'
                  displayName: 'Deploy backend to $(AZURE_WEBAPP_NAME_BACKEND)'
                # Configure startup command, health check, and app settings for backend
                - task: AzureCLI@2
                  displayName: 'Configure backend App Service (startup, health check, app settings)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      echo "Setting startup command"
                      az webapp config set \
                        --resource-group "$(ResourceGroupName)" \
                        --name "$(AZURE_WEBAPP_NAME_BACKEND)" \
                        --startup-file "bash scripts/startup.sh"

                      echo "Setting health check path"
                      az webapp config set \
                        --resource-group "$(ResourceGroupName)" \
                        --name "$(AZURE_WEBAPP_NAME_BACKEND)" \
                        --health-check-path "/api/health"

                      echo "Applying app settings"
                      az webapp config appsettings set \
                        --resource-group "$(ResourceGroupName)" \
                        --name "$(AZURE_WEBAPP_NAME_BACKEND)" \
                        --settings \
                          SECRET_KEY="$(SECRET_KEY)" \
                          DB_HOST="$(DB_HOST)" \
                          DB_NAME="$(DB_NAME)" \
                          DB_USER="$(DB_USER)" \
                          DB_PASSWORD="$(DB_PASSWORD)" \
                          PYTHONUNBUFFERED=1 \
                          CORS_ALLOWED_ORIGINS="$(CORS_ALLOWED_ORIGINS)"
                  condition: and(ne(variables.ResourceGroupName, ''), ne(variables.SECRET_KEY, ''))

      - deployment: DeployFrontend
        displayName: Deploy frontend (Next.js) to Azure Web App
        environment: 'dev'
        condition: and(ne(variables.azureServiceConnection, ''), ne(variables.AZURE_WEBAPP_NAME_FRONTEND, ''))
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(frontend_artifact)
                # If using Static Web Apps, use AzureStaticWebApp task instead of App Service
                # To enable, set variable USE_SWA to 'true' and provide STATIC_WEB_APPS_API_TOKEN as a secret variable
                - ${{ if eq(variables.USE_SWA, 'true') }}:
                  - task: AzureStaticWebApp@0
                    inputs:
                      app_location: '$(Pipeline.Workspace)/$(frontend_artifact)'
                      output_location: ''
                      skip_app_build: true
                      azure_static_web_apps_api_token: '$(STATIC_WEB_APPS_API_TOKEN)'
                    displayName: 'Deploy frontend to Azure Static Web Apps'
                - ${{ if ne(variables.USE_SWA, 'true') }}:
                  - task: AzureWebApp@1
                    inputs:
                      azureSubscription: '$(azureServiceConnection)'
                      appType: 'webAppLinux'
                      appName: '$(AZURE_WEBAPP_NAME_FRONTEND)'
                      package: '$(Pipeline.Workspace)/$(frontend_artifact)'
                    displayName: 'Deploy frontend to $(AZURE_WEBAPP_NAME_FRONTEND)'
                  - task: AzureCLI@2
                    displayName: 'Configure frontend App Service (health check)'
                    inputs:
                      azureSubscription: '$(azureServiceConnection)'
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -e
                        echo "Setting health check path for frontend"
                        az webapp config set \
                          --resource-group "$(ResourceGroupName)" \
                          --name "$(AZURE_WEBAPP_NAME_FRONTEND)" \
                          --health-check-path "/"
                    condition: ne(variables.ResourceGroupName, '')
