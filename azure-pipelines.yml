# Azure Pipelines for POLMED ERP (Next.js frontend + Flask backend)
# - Builds frontend with pnpm and publishes artifact
# - Builds backend (Flask) with Python and publishes artifact
# - Optional deployment stage placeholders (disabled unless variables provided)
trigger:
  branches:
    include:
      - master

variables:
  - name: azureServiceConnectionId
    value: '98653454-585c-45a1-8ad4-5a09ad42b645'
  - name: webAppName
    value: 'app-polmed-backend'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: environmentName
    value: 'app-polmed-backend'
  - name: projectRoot
    value: $(System.DefaultWorkingDirectory)
  - name: pythonVersion
    value: '3.11'

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: BuildJob
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'
          - task: CmdLine@2
            displayName: "Install requirements (prod + dev)"
            inputs:
              script: |
                python -m venv .venv
                . .venv/bin/activate
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                if [ -f requirements-dev.txt ]; then
                  pip install -r requirements-dev.txt
                else
                  echo "requirements-dev.txt not found; installing test/lint tools"
                  pip install pytest pytest-cov ruff
                fi
              workingDirectory: $(projectRoot)/scripts
          - task: CmdLine@2
            displayName: "Lint (ruff)"
            inputs:
              script: |
                . .venv/bin/activate
                ruff --version
                # Auto-fix safe issues, then verify clean
                ruff check . --fix
                ruff check .
              workingDirectory: $(projectRoot)/scripts
          - task: CmdLine@2
            displayName: "Run tests (pytest) with coverage"
            inputs:
              script: |
                . .venv/bin/activate
                pytest -q --maxfail=1 --disable-warnings \
                  --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml \
                  --cov=. \
                  --cov-report=xml:$(Build.ArtifactStagingDirectory)/coverage.xml \
                  --cov-report=term-missing
              workingDirectory: $(projectRoot)/scripts
          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/test-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Python tests'
          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage"
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Build.ArtifactStagingDirectory)/coverage.xml'
              reportDirectory: '$(Build.ArtifactStagingDirectory)'
          - task: ArchiveFiles@2
            displayName: 'Archive files'
            inputs:
              rootFolderOrFile: '$(projectRoot)/scripts'
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
              replaceExistingArchive: true
          - task: PublishBuildArtifacts@1
            displayName: 'Upload package'
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
              ArtifactName: drop
              publishLocation: 'Container'
  - stage: Deploy
    displayName: 'Deploy Web App'
    dependsOn:
      - Build
    condition: succeeded()
    jobs:
      - deployment: DeploymentJob
        pool:
          vmImage: $(vmImageName)
        environment:
          name: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'
                  displayName: 'Use Python version'
                - task: AzureWebApp@1
                  displayName: 'Deploy Azure Web App : app-polmed-backend'
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              # End of deploy steps
