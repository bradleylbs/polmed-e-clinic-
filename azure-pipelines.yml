# Azure Pipelines for POLMED ERP (Flask backend only)
# - Builds backend (Flask) with Python and publishes artifact
# - Deploys ZIP to Azure Web App (Linux)
trigger:
  branches:
    include:
      - master

variables:
  - name: azureServiceConnectionId
    value: '98653454-585c-45a1-8ad4-5a09ad42b645'
  - name: webAppName
    value: 'app-polmed-backend'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: environmentName
    value: 'app-polmed-backend'
  - name: webAppResourceGroup
    value: ''
  - name: projectRoot
    value: $(System.DefaultWorkingDirectory)
  - name: pythonVersion
    value: '3.11'

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: BuildJob
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'
          - task: CmdLine@2
            displayName: "Install requirements"
            inputs:
              script: |
                python -m venv .venv
                . .venv/bin/activate
                python -m pip install --upgrade pip
                pip install -r requirements.txt
              workingDirectory: $(projectRoot)/scripts
          - task: ArchiveFiles@2
            displayName: 'Archive files'
            inputs:
              rootFolderOrFile: '$(projectRoot)/scripts'
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
              replaceExistingArchive: true
          - task: PublishBuildArtifacts@1
            displayName: 'Upload package'
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
              ArtifactName: drop
              publishLocation: 'Container'
  - stage: Deploy
    displayName: 'Deploy Web App'
    dependsOn:
      - Build
    condition: succeeded()
    jobs:
      - deployment: DeploymentJob
        pool:
          vmImage: $(vmImageName)
        environment:
          name: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Ensure remote build is enabled (SCM_DO_BUILD_DURING_DEPLOYMENT)'
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # Resolve resource group: use provided variable if set, else auto-detect
                      if [ -n "$(webAppResourceGroup)" ]; then
                        RG_NAME="$(webAppResourceGroup)"
                        echo "Using provided resource group: ${RG_NAME}"
                      else
                        RG_NAME=$(az webapp list --query "[?name=='$(webAppName)'].resourceGroup | [0]" -o tsv || true)
                        if [ -z "${RG_NAME}" ]; then
                          RG_NAME=$(az resource show --name $(webAppName) --resource-type "Microsoft.Web/sites" --query resourceGroup -o tsv || true)
                        fi
                        if [ -z "${RG_NAME}" ]; then
                          echo "ERROR: Could not resolve resource group for web app '$(webAppName)'. Set 'webAppResourceGroup' variable or ensure the app exists in the current subscription." >&2
                          exit 1
                        fi
                        echo "Auto-detected resource group: ${RG_NAME}"
                      fi
                      az webapp config appsettings set \
                        --name $(webAppName) \
                        --resource-group "$RG_NAME" \
                        --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
                      echo "App setting SCM_DO_BUILD_DURING_DEPLOYMENT set to true."
                - task: AzureWebApp@1
                  displayName: 'Deploy Azure Web App : app-polmed-backend'
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              # End of deploy steps
