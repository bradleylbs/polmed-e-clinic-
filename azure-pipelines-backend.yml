trigger:
- main   # Or master, depending on your repo branch

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    architecture: 'x64'

- script: |
    cd scripts
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'polmed-azure-connection'   # Service connection name
    appName: 'app-polmed-backend'                  # Your App Service name
    package: '$(System.DefaultWorkingDirectory)/scripts'
    # Startup command in Azure portal: gunicorn -w 4 -b 0.0.0.0:8000 app:app
